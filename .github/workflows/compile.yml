name: udp2raw Makefile Inspection

on:
  workflow_dispatch: # 깃허브 웹 화면에서 클릭으로 실행

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 소스코드 가져오기 (Checkout)
        uses: actions/checkout@v4

      - name: 2. [실사] Makefile 진짜 내용 출력
        run: |
          echo "=== MAKEFILE CONTENT FACT ==="
          cat makefile || cat Makefile
