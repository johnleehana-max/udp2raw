name: udp2raw Fully Static Build for ASUS Router (ARM64)

on:
  workflow_dispatch: # 깃허브 웹 화면에서 클릭으로 실행

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 소스코드 가져오기 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 64비트 ARM 크로스 컴파일러 툴체인 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu make

      - name: 3. 누락되었던 필수 유령 헤더(git_version.h) 강제 생성
        run: |
          echo "const char *gitversion = \"$(git rev-parse HEAD 2>/dev/null || echo "static_build_arm64")\";" > git_version.h
          cat git_version.h

      - name: 4. 장부 기반 100% 완전 정적 크로스 컴파일 (ARM64 AES 가속 결속)
        run: |
          mkdir -p output
          # Makefile 장부의 COMMON, SOURCES_AES_ACC, FLAGS, LINK 구성을 완벽하게 융합한 단 한 줄의 정밀 타격입니다.
          aarch64-linux-gnu-g++ -O3 -std=c++11 -Wall -Wextra \
            -Wno-unused-variable -Wno-unused-parameter -Wno-missing-field-initializers \
            -I. -isystem libev -static \
            main.cpp lib/md5.cpp lib/pbkdf2-sha1.cpp lib/pbkdf2-sha256.cpp \
            encrypt.cpp log.cpp network.cpp common.cpp connection.cpp misc.cpp \
            fd_manager.cpp client.cpp server.cpp my_ev.cpp lib/aes_acc/aes*.c \
            lib/aes_acc/asm/arm64.S \
            -o output/udp2raw_arm64_asm_aes \
            -lpthread -lrt -lgcc_eh

      - name: 5. 최종 결과물 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: udp2raw-Asus-Static-Binary
          path: output/udp2raw_arm64_asm_aes
