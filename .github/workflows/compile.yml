name: udp2raw Truly Static Build for ASUS Router (ARM64)

on:
  workflow_dispatch: # 깃허브 웹 화면에서 클릭으로 실행

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 소스코드 가져오기 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 64비트 ARM 크로스 컴파일러 툴체인 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu make

      - name: 3. 진짜 완전 정적 바이너리 크로스 컴파일 (변수 교정)
        run: |
          # Makefile의 표준 변수인 CXX와 FLAGS 규격을 아수스 musl 커널에 맞게 강제 주입합니다.
          make generic CXX=aarch64-linux-gnu-g++ CXXFLAGS="-static -O3" LDFLAGS="-static"

      - name: 4. 빌드 결과물 파일명 정렬
        run: |
          mkdir -p output
          if [ -f "udp2raw" ]; then
            mv udp2raw output/udp2raw_arm64_asm_aes
          else
            mv udp2raw_arm output/udp2raw_arm64_asm_aes || cp a.out output/udp2raw_arm64_asm_aes
          fi

      - name: 5. 최종 결과물 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: udp2raw-Asus-Static-Binary
          path: output/udp2raw_arm64_asm_aes
