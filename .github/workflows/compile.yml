name: udp2raw Fully Static Build for ASUS Router (ARM64)

on:
  workflow_dispatch: # 깃허브 웹 화면에서 클릭 한 번으로 실행할 수 있도록 설정

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 소스코드 가져오기 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 64비트 ARM 크로스 컴파일러 툴체인 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu make

      - name: 3. 완전 정적 바이너리 크로스 컴파일 진행
        run: |
          # udp2raw 소스코드 내 Makefile 변수를 강제 오버라이드하여 컴파일 진행
          # cc_cross 변수에 aarch64 툴체인을 지정하고, 완벽한 정적 빌드를 위해 -static 및 -O3을 주입합니다.
          make aarch64 cc_cross=aarch64-linux-gnu-g++ FLAGS="-static -O3"

      - name: 4. 빌드 결과물 파일명 정렬
        run: |
          mkdir -p output
          # 빌드된 arm 바이너리를 사용자가 요청한 타겟 명칭으로 안전하게 복사
          if [ -f "udp2raw_arm" ]; then
            cp udp2raw_arm output/udp2raw_arm64_asm_aes
          else
            # 명칭이 다를 경우를 대비한 예외 처리 예비 장치
            cp udp2raw* output/udp2raw_arm64_asm_aes || cp a.out output/udp2raw_arm64_asm_aes
          fi

      - name: 5. 최종 결과물 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: udp2raw-Asus-Static-Binary
          path: output/udp2raw_arm64_asm_aes
