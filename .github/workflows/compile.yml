name: udp2raw Fully Static Build for ASUS Router (ARM64)

on:
  workflow_dispatch: # 깃허브 웹 화면에서 클릭으로 실행

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 소스코드 가져오기 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 64비트 ARM 크로스 컴파일러 툴체인 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu make

      - name: 3. [실사] 저장소 루트 디렉토리 파일 구조 확인
        run: |
          echo "=== REPOSITORY FILE LIST ==="
          ls -la

      - name: 4. 경로 교정 및 완전 정적 크로스 컴파일 진행
        run: |
          mkdir -p output
          # src/ 경로를 제거하고 루트 폴더의 핵심 소스 5개를 직접 지목하여 완전 정적(Static) 바이너리를 생성합니다.
          aarch64-linux-gnu-g++ -O3 -w -static main.cpp encrypt.cpp log.cpp network.cpp common.cpp -o output/udp2raw_arm64_asm_aes -lrt

      - name: 5. 최종 결과물 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: udp2raw-Asus-Static-Binary
          path: output/udp2raw_arm64_asm_aes
